services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dns-threat-events --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dns-threat-events-scored --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dns-threat-events-dead-letter --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: dns-threat-events
      KAFKA_OUTPUT_TOPIC: dns-threat-events-scored
      KAFKA_DEAD_LETTER_TOPIC: dns-threat-events-dead-letter
      FLINK_REST_URL: http://flink-jobmanager:8081
      EVENT_API_URL: ${EVENT_API_URL:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - threat-cache:/app/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  flink-jobmanager:
    image: flink:1.20.1-scala_2.12-java17
    command: jobmanager
    restart: unless-stopped
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        rest.bind-port: 8081
    ports:
      - "8081:8081"
    volumes:
      - flink-checkpoints:/flink-checkpoints
    depends_on:
      flink-checkpoint-init:
        condition: service_completed_successfully

  flink-taskmanager:
    image: flink:1.20.1-scala_2.12-java17
    command: taskmanager
    restart: unless-stopped
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1024m
    volumes:
      - flink-checkpoints:/flink-checkpoints
    depends_on:
      - flink-jobmanager

  flink-checkpoint-init:
    image: busybox:1.36
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /flink-checkpoints && chown -R 9999:9999 /flink-checkpoints
    volumes:
      - flink-checkpoints:/flink-checkpoints
    restart: "no"

  flink-submit:
    build:
      context: .
      dockerfile: Dockerfile.flink
    command:
      - sh
      - -c
      - >-
        until /opt/flink/bin/flink list -m flink-jobmanager:8081 >/dev/null 2>&1;
        do sleep 2; done;
        /opt/flink/bin/flink run -m flink-jobmanager:8081 -d
        /opt/flink/usrlib/dns-threat-pipeline.jar
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: dns-threat-events
      KAFKA_OUTPUT_TOPIC: dns-threat-events-scored
      KAFKA_DEAD_LETTER_TOPIC: dns-threat-events-dead-letter
      MODEL_API_URL: http://api:8000
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  api-poller:
    profiles: ["source"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "pipeline.api_poller"]
    environment:
      EVENT_API_URL: ${EVENT_API_URL:-}
      EVENT_API_AUTH_HEADER: ${EVENT_API_AUTH_HEADER:-Authorization}
      EVENT_API_AUTH_SCHEME: ${EVENT_API_AUTH_SCHEME:-Bearer}
      EVENT_API_INTERVAL_SECONDS: ${EVENT_API_INTERVAL_SECONDS:-30}
      EVENT_API_ITEMS_PATH: ${EVENT_API_ITEMS_PATH:-data}
      EVENT_API_CURSOR_PATH: ${EVENT_API_CURSOR_PATH:-pagination.next_cursor}
      EVENT_API_CURSOR_PARAMETER: ${EVENT_API_CURSOR_PARAMETER:-cursor}
      EVENT_API_STATE_FILE: /app/data/event_api_cursor.json
      API_SECRET: ${API_SECRET:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: dns-threat-events
    volumes:
      - event-api-state:/app/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  synthetic-dns-source:
    profiles: ["simulation"]
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "pipeline.synthetic_dns_source"]
    environment:
      SYNTHETIC_API_BASE_URL: http://api:8000
      SYNTHETIC_EVENT_INTERVAL_SECONDS: ${SYNTHETIC_EVENT_INTERVAL_SECONDS:-1.5}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
  threat-cache:
  flink-checkpoints:
  event-api-state:
